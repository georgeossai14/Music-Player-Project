<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deftones</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://kit.fontawesome.com/fa6d72b885.js" crossorigin="anonymous"></script>
</head>

<body>
  <div class="container">
    <div class="music-player">
      <nav>
        <div class="circle">
          <i class="fa-solid fa-angle-left"></i>
        </div>
        <div class="circle">
          <i class="fa-solid fa-bars"></i>
        </div>
      </nav>
      <div id="music">
        <img id="songImg">
        <h1 id="songTitle"></h1>
        <p id="songArtist"></p>
      </div>


      <audio id="song">
      </audio>
      <input type="range" value="0" id="progress">

      <div class="controls">
        <div onclick="prevSong()"><i class="fa-solid fa-backward"></i></div>
        <div id="playBtn" onclick="playPause()"><i class="fa-solid fa-play"></i></div>
        <div onclick="nextSong()"><i class="fa-solid fa-forward"></i></div>
      </div>

    </div>
  </div>

  <script src="script.js"></script>
</body>

</html>
